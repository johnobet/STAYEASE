name: stayease
description: "AI-powered boarding house marketplace and property management platform"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Google Fonts
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: 4.14.0
  firebase_auth: 6.6.1
  cloud_firestore: 6.9.0
  cloud_functions: ^6.4.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  http: ^1.2.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true